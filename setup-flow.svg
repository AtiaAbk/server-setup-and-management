<svg viewBox="0 0 1000 220" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1000" height="220" fill="#0d1117"/>

  <!-- step boxes -->
  <g font-size="12" fill="#c9d1d9" text-anchor="middle">
    <!-- 1 -->
    <rect x="20" y="70" width="150" height="80" rx="10" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
    <text x="95" y="100" font-weight="bold" font-size="14">1. Install</text>
    <text x="95" y="120">Apache, MySQL,</text>
    <text x="95" y="136">PHP</text>

    <!-- 2 -->
    <rect x="200" y="70" width="150" height="80" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <text x="275" y="100" font-weight="bold" font-size="14">2. Upload</text>
    <text x="275" y="120">Website files to</text>
    <text x="275" y="136">/var/www/html/</text>

    <!-- 3 -->
    <rect x="380" y="70" width="150" height="80" rx="10" fill="#161b22" stroke="#d29922" stroke-width="2"/>
    <text x="455" y="100" font-weight="bold" font-size="14">3. Permissions</text>
    <text x="455" y="120">chown + chmod</text>
    <text x="455" y="136">www-data</text>

    <!-- 4 -->
    <rect x="560" y="70" width="150" height="80" rx="10" fill="#161b22" stroke="#f85149" stroke-width="2"/>
    <text x="635" y="100" font-weight="bold" font-size="14">4. Firewall</text>
    <text x="635" y="120">ufw allow</text>
    <text x="635" y="136">'Apache Full'</text>

    <!-- 5 -->
    <rect x="740" y="70" width="150" height="80" rx="10" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
    <text x="815" y="100" font-weight="bold" font-size="14">5. Test</text>
    <text x="815" y="120">curl / browser</text>
    <text x="815" y="136">check</text>
  </g>

  <!-- arrows -->
  <g stroke="#6e7681" stroke-width="2" marker-end="url(#arrow2)">
    <line x1="170" y1="110" x2="198" y2="110"/>
    <line x1="350" y1="110" x2="378" y2="110"/>
    <line x1="530" y1="110" x2="558" y2="110"/>
    <line x1="710" y1="110" x2="738" y2="110"/>
  </g>

  <defs>
    <marker id="arrow2" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#6e7681"/>
    </marker>
  </defs>

  <text x="500" y="30" fill="#c9d1d9" font-size="15" text-anchor="middle" font-weight="bold">Server Setup Pipeline</text>
  <text x="500" y="190" fill="#6e7681" font-size="11" text-anchor="middle">Each step builds on the one before it — don't skip permissions or the firewall step!</text>
</svg>
