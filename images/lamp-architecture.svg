<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="320" fill="#0d1117"/>

  <!-- Browser -->
  <rect x="20" y="120" width="140" height="80" rx="10" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="90" y="155" fill="#c9d1d9" font-size="15" text-anchor="middle" font-weight="bold">Browser</text>
  <text x="90" y="175" fill="#8b949e" font-size="11" text-anchor="middle">Client / User</text>

  <!-- Apache -->
  <rect x="230" y="100" width="150" height="120" rx="10" fill="#161b22" stroke="#d22128" stroke-width="2"/>
  <text x="305" y="140" fill="#c9d1d9" font-size="15" text-anchor="middle" font-weight="bold">Apache</text>
  <text x="305" y="160" fill="#8b949e" font-size="11" text-anchor="middle">Web Server</text>
  <text x="305" y="178" fill="#8b949e" font-size="11" text-anchor="middle">Port 80 / 443</text>
  <text x="305" y="196" fill="#8b949e" font-size="10" text-anchor="middle">/var/www/html/</text>

  <!-- PHP -->
  <rect x="450" y="100" width="150" height="120" rx="10" fill="#161b22" stroke="#777bb4" stroke-width="2"/>
  <text x="525" y="140" fill="#c9d1d9" font-size="15" text-anchor="middle" font-weight="bold">PHP</text>
  <text x="525" y="160" fill="#8b949e" font-size="11" text-anchor="middle">Application Logic</text>
  <text x="525" y="178" fill="#8b949e" font-size="11" text-anchor="middle">Processes dynamic</text>
  <text x="525" y="194" fill="#8b949e" font-size="11" text-anchor="middle">requests</text>

  <!-- MySQL -->
  <rect x="670" y="100" width="180" height="120" rx="10" fill="#161b22" stroke="#4479a1" stroke-width="2"/>
  <text x="760" y="140" fill="#c9d1d9" font-size="15" text-anchor="middle" font-weight="bold">MySQL</text>
  <text x="760" y="160" fill="#8b949e" font-size="11" text-anchor="middle">Database Server</text>
  <text x="760" y="178" fill="#8b949e" font-size="11" text-anchor="middle">Stores &amp; retrieves</text>
  <text x="760" y="194" fill="#8b949e" font-size="11" text-anchor="middle">data</text>

  <!-- Arrows request -->
  <line x1="160" y1="145" x2="228" y2="145" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="194" y="132" fill="#58a6ff" font-size="10" text-anchor="middle">HTTP GET</text>

  <line x1="380" y1="145" x2="448" y2="145" stroke="#777bb4" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="414" y="132" fill="#777bb4" font-size="10" text-anchor="middle">run .php</text>

  <line x1="600" y1="145" x2="668" y2="145" stroke="#4479a1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="634" y="132" fill="#4479a1" font-size="10" text-anchor="middle">SQL query</text>

  <!-- Arrows response -->
  <line x1="668" y1="180" x2="600" y2="180" stroke="#4479a1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="634" y="196" fill="#4479a1" font-size="10" text-anchor="middle">result set</text>

  <line x1="448" y1="180" x2="380" y2="180" stroke="#777bb4" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="414" y="196" fill="#777bb4" font-size="10" text-anchor="middle">rendered HTML</text>

  <line x1="228" y1="180" x2="160" y2="180" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="194" y="196" fill="#58a6ff" font-size="10" text-anchor="middle">HTTP 200</text>

  <text x="450" y="270" fill="#c9d1d9" font-size="13" text-anchor="middle" font-weight="bold">LAMP Stack — Request &amp; Response Flow</text>
  <text x="450" y="292" fill="#6e7681" font-size="11" text-anchor="middle">Linux (host OS) runs all three services underneath</text>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L6,3 z" fill="#58a6ff"/>
    </marker>
  </defs>
</svg>
